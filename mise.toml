[tools]
bun = "latest"
fd = "latest"
jq = "latest"
"npm:context-mode" = "latest"
"pipx:graphifyy" = "latest"
pnpm = "latest"
ripgrep = "latest"
rtk = "latest"
uv = "latest"

[settings.npm]
package_manager = "pnpm"

[tasks.setup-git]
description = "Wire commit template + repo-local hook"
run = "git config commit.template .gitmessage && git config core.hooksPath githooks"

[tasks.setup-graphify]
run = "graphify pi install"
